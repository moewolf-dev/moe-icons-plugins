name: Update from Moe Icons resource release
run-name: Plugin resource ${{ github.event.client_payload.eventId }}
on:
  repository_dispatch:
    types: [moe-icons-code-library-release]
permissions:
  contents: write
  actions: write
concurrency:
  group: plugin-resource-update
  cancel-in-progress: false
  queue: max
jobs:
  update:
    if: github.repository == 'moewolf-dev/moe-icons-plugins'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      RESOURCE_VERSION: ${{ github.event.client_payload.resourceVersion }}
      SOURCE_COMMIT: ${{ github.event.client_payload.sourceCommit }}
      GENERATOR_COMMIT: ${{ github.event.client_payload.generatorCommit }}
      CLI_VERSION: ${{ github.event.client_payload.cliVersion }}
      CLI_PUBLISH_RUN_ID: ${{ github.event.client_payload.cliPublishRunId }}
      CLI_PUBLISH_HEAD: ${{ github.event.client_payload.cliPublishHead }}
      CLI_NPM_INTEGRITY: ${{ github.event.client_payload.cliNpmIntegrity }}
      RESOURCE_DIGEST: ${{ github.event.client_payload.resourceDigest }}
      DESCRIPTOR_SHA256: ${{ github.event.client_payload.descriptorSha256 }}
      PRODUCTION_ARTIFACT_ID: ${{ github.event.client_payload.productionArtifactId }}
      EVENT_ID: ${{ github.event.client_payload.eventId }}
      UPSTREAM_RUN_ID: ${{ github.event.client_payload.upstreamRunId }}
      UPSTREAM_RUN_ATTEMPT: ${{ github.event.client_payload.upstreamRunAttempt }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Verify exact producer and published CLI, retain metadata only
        env:
          GH_TOKEN: ${{ secrets.LIBRARY_ARTIFACT_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo 'Configure LIBRARY_ARTIFACT_READ_TOKEN with code-library Actions read permission'; exit 1; }
          root="$RUNNER_TEMP/moe-icons-plugin-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "MOE_ICONS_RELEASE_ROOT=$root" >> "$GITHUB_ENV"
          node scripts/verify-resource-input.mjs "$root"
      - name: Allocate or resume the verified joint delivery
        run: |
          node scripts/release-state.mjs allocate "$MOE_ICONS_RELEASE_ROOT/event.json"
      - name: Generate metadata and validate
        run: |
          set -euo pipefail
          npm ci
          node scripts/generate-icons-data.mjs "$MOE_ICONS_RELEASE_ROOT"
          npm run compile
          npm test
          npm run build
          npm run release:validate
      - name: Commit or reuse the immutable plugin version
        id: version
        run: |
          git config user.name moe-icons-release-bot
          git config user.email moe-icons-release-bot@users.noreply.github.com
          node scripts/commit-resource-update.mjs "$MOE_ICONS_RELEASE_ROOT/event.json"
      - name: Explicitly publish and verify Marketplace bytes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: node scripts/publish-resource-update.mjs
      - name: Persist verified release stages
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/plugin-readback-${GITHUB_RUN_ID}/plugin-publication-receipt.json"
          node --input-type=module - "$receipt" <<'NODE'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const receipt=JSON.parse(fs.readFileSync(process.argv[2]));
          for(const phase of ['packaged','published','verified']) {
            const state=JSON.parse(fs.readFileSync('data/release-state.json'));
            const entry=state.events.find(item=>item.eventId===receipt.eventId);
            const phases=['versionAllocated','packaged','published','verified'];
            if(phases.indexOf(entry.phase)>=phases.indexOf(phase)) continue;
            execFileSync(process.execPath,['scripts/release-state.mjs','mark',receipt.eventId,phase,JSON.stringify({tag:receipt.tag,vsixSha256:receipt.vsixSha256})],{stdio:'inherit'});
          }
          NODE
          git add data/release-state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): record verified ${EVENT_ID} [skip ci]"
            git push origin HEAD:main
          fi
      - name: Preserve final publication receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: plugin-publication-receipt
          path: ${{ runner.temp }}/plugin-readback-${{ github.run_id }}/plugin-publication-receipt.json
          if-no-files-found: warn
          retention-days: 90
      - name: Clean private input
        if: always()
        run: |
          if [ -n "${MOE_ICONS_RELEASE_ROOT:-}" ]; then rm -rf -- "$MOE_ICONS_RELEASE_ROOT"; fi
