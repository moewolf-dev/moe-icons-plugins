name: Update from Moe Icons resource release

# Package-set releases verify exact candidate roots/pages and fetch only scoped
# metadata packages. The legacy aggregate receiver remains permanently closed.
run-name: Plugin resource ${{ github.event.client_payload.eventId }}
on:
  repository_dispatch:
    types: [moe-icons-code-library-release, moe-icons-cli-release, moe-icons-package-set-release]
permissions: {}
concurrency:
  group: plugin-resource-update
  cancel-in-progress: false
  queue: max
jobs:
  update:
    # Legacy aggregate events stay closed. The package-set receiver is gated by
    # the repository's existing explicit auto-release switch.
    if: github.repository == 'moewolf-dev/moe-icons-plugins' && vars.MOEICONS_AUTO_RELEASE_ENABLED == 'true' && (github.event.action == 'moe-icons-cli-release' || github.event.action == 'moe-icons-package-set-release')
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      actions: write
      contents: write
      id-token: write
    env:
      DELIVERY_KIND: ${{ github.event.action }}
      CLI_RELEASE_COMMIT: ${{ github.event.client_payload.delivery.cliReleaseCommit }}
      RESOURCE_VERSION: ${{ github.event.client_payload.delivery.resourceVersion }}
      SOURCE_COMMIT: ${{ github.event.client_payload.delivery.sourceCommit }}
      GENERATOR_COMMIT: ${{ github.event.client_payload.delivery.generatorCommit }}
      CLI_VERSION: ${{ github.event.client_payload.delivery.cliVersion }}
      CLI_PUBLISH_RUN_ID: ${{ github.event.client_payload.delivery.cliPublishRunId }}
      CLI_PUBLISH_HEAD: ${{ github.event.client_payload.delivery.cliPublishHead }}
      CLI_NPM_INTEGRITY: ${{ github.event.client_payload.delivery.cliNpmIntegrity }}
      RESOURCE_DIGEST: ${{ github.event.client_payload.delivery.resourceDigest }}
      DESCRIPTOR_SHA256: ${{ github.event.client_payload.delivery.descriptorSha256 }}
      SOURCE_DISPATCH_ID: ${{ github.event.client_payload.delivery.sourceDispatchId }}
      PACKAGE_SET_FREE_SHA256: ${{ github.event.client_payload.delivery.packageSets.free.packageSetSha256 || github.event.client_payload.delivery.free.packageSetSha256 }}
      PACKAGE_SET_PRO_SHA256: ${{ github.event.client_payload.delivery.packageSets.pro.packageSetSha256 || github.event.client_payload.delivery.pro.packageSetSha256 }}
      PRODUCTION_ARTIFACT_ID: ${{ github.event.client_payload.delivery.productionArtifactId }}
      EVENT_ID: ${{ github.event.client_payload.delivery.eventId }}
      UPSTREAM_RUN_ID: ${{ github.event.client_payload.delivery.upstreamRunId || github.event.client_payload.delivery.producer.runId }}
      UPSTREAM_RUN_ATTEMPT: ${{ github.event.client_payload.delivery.upstreamRunAttempt || github.event.client_payload.delivery.producer.runAttempt }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Verify exact producer and published CLI, retain metadata only
        env:
          GH_TOKEN: ${{ secrets.LIBRARY_ARTIFACT_READ_TOKEN }}
          SMALL_PACK_WITNESS_TRANSPORT_REPORT: ${{ runner.temp }}/plugin-witness-transport.json
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/moe-icons-plugin-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "MOE_ICONS_RELEASE_ROOT=$root" >> "$GITHUB_ENV"
          if [ "$DELIVERY_KIND" = moe-icons-cli-release ]; then
            test -n "$GH_TOKEN" || { echo 'Configure LIBRARY_ARTIFACT_READ_TOKEN with code-library Actions read access'; exit 1; }
            node scripts/verify-cli-input.mjs "$root"
          elif [ "$DELIVERY_KIND" = moe-icons-package-set-release ]; then
            test -n "$GH_TOKEN" || { echo 'Configure LIBRARY_ARTIFACT_READ_TOKEN with code-library Actions read permission'; exit 1; }
            node scripts/verify-small-pack-pin.mjs
            node scripts/verify-package-set-input.mjs "$root"
          else
            echo 'Aggregate resource receiver is retired; use moe-icons-package-set-release' >&2
            exit 1
          fi
      - name: Preserve execution witness transfer evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: plugin-witness-transport-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/plugin-witness-transport.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Allocate or resume the verified joint delivery
        run: |
          node scripts/release-state.mjs allocate "$MOE_ICONS_RELEASE_ROOT/event.json"
      - name: Generate metadata and validate
        env:
          MOEICONS_API_BASE_URL: https://api.moeicons.com
        run: |
          set -euo pipefail
          npm ci
          if [ "$DELIVERY_KIND" = moe-icons-package-set-release ] || { [ "$DELIVERY_KIND" = moe-icons-cli-release ] && [ -f "$MOE_ICONS_RELEASE_ROOT/package-set-binding.json" ]; }; then
            node scripts/generate-icons-data-from-package-sets.mjs "$MOE_ICONS_RELEASE_ROOT/package-set-binding.json"
          fi
          npm run compile
          npm test
          npm run build
          npm run release:validate
      - name: Commit or reuse the immutable plugin version
        id: version
        run: |
          git config user.name moe-icons-release-bot
          git config user.email moe-icons-release-bot@users.noreply.github.com
          node scripts/commit-resource-update.mjs "$MOE_ICONS_RELEASE_ROOT/event.json"
      - name: Explicitly publish and verify Marketplace bytes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: node scripts/publish-resource-update.mjs
      - name: Persist verified release stages
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/plugin-readback-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/plugin-publication-receipt.json"
          node --input-type=module - "$receipt" <<'NODE'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const receipt=JSON.parse(fs.readFileSync(process.argv[2]));
          for(const phase of ['packaged','published','verified']) {
            const state=JSON.parse(fs.readFileSync('data/release-state.json'));
            const entry=state.events.find(item=>item.eventId===receipt.eventId);
            const phases=['versionAllocated','packaged','published','verified'];
            if(phases.indexOf(entry.phase)>=phases.indexOf(phase)) continue;
            execFileSync(process.execPath,['scripts/release-state.mjs','mark',receipt.eventId,phase,JSON.stringify({tag:receipt.tag,vsixSha256:receipt.vsixSha256})],{stdio:'inherit'});
          }
          NODE
          git add data/release-state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): record verified ${EVENT_ID} [skip ci]"
            git push origin HEAD:main
          fi
      - name: Preserve final publication receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: plugin-publication-receipt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/plugin-readback-${{ github.run_id }}-${{ github.run_attempt }}/plugin-publication-receipt.json
          if-no-files-found: warn
          retention-days: 90
      - name: Clean private input
        if: always()
        run: |
          if [ -n "${MOE_ICONS_RELEASE_ROOT:-}" ]; then rm -rf -- "$MOE_ICONS_RELEASE_ROOT"; fi
