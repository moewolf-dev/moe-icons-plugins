name: CI

on:
  pull_request:
  push:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run compile
      - name: Checkout tested CLI generation implementation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: moewolf-dev/moe-icons-cli
          ref: 5638faba36bf0287b96d32ec936d91af4ea221a4
          path: .tmp/cli-integration
          persist-credentials: false
      - name: Prepare real CLI integration checks
        run: |
          npm ci --prefix .tmp/cli-integration
          echo "MOEICONS_CLI_REPO=$GITHUB_WORKSPACE/.tmp/cli-integration" >> "$GITHUB_ENV"
      - run: npm test
      - run: npm run build
      - run: npm run release:validate
