name: release

# Skeleton for automated publishing. Real publishing requires a Marketplace
# publisher token and GitHub release permissions that are provided externally.
# This workflow currently runs a dry-run build only.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - run: npm ci
      - run: npm run compile
      - run: npm test
      - run: npm run build

  # Reserved: package + publish steps will be added once publisher token and
  # release permissions are provided externally. No secrets are stored here.
