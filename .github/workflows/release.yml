name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing stable vX.Y.Z tag on main to package or publish.
        required: true
        type: string
      publish:
        description: Publish the reviewed artifact to GitHub Release and Marketplace via Entra ID.
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: extension-release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.event_name == 'push' && github.repository == 'moewolf-dev/moe-icons-plugins'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch publication on the federated main branch
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e 'if (!/^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(process.env.RELEASE_TAG || "")) process.exit(1)'
          gh workflow run release.yml --repo moewolf-dev/moe-icons-plugins --ref main -f "release_tag=$RELEASE_TAG" -f publish=true

  package:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'moewolf-dev/moe-icons-plugins'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      vsix-name: ${{ steps.package.outputs.name }}
      vsix-sha256: ${{ steps.package.outputs.sha256 }}
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
      - name: Validate immutable tag and its ancestry on main
        run: |
          node -e 'if (!/^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(process.env.RELEASE_TAG || "")) { console.error("A stable vX.Y.Z tag is required"); process.exit(1); }'
          git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}"
          git merge-base --is-ancestor "refs/tags/$RELEASE_TAG^{commit}" origin/main
          git checkout --detach "refs/tags/$RELEASE_TAG"
          node -e 'if (process.env.RELEASE_TAG !== `v${require("./package.json").version}`) process.exit(1)'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run compile
      - name: Checkout tested CLI generation implementation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: moewolf-dev/moe-icons-cli
          ref: 4c78e58dbb8cc24cdddb8a56158342ab467e66be
          path: .tmp/cli-integration
          persist-credentials: false
      - name: Prepare real CLI integration checks
        run: |
          npm ci --prefix .tmp/cli-integration
          echo "MOEICONS_CLI_REPO=$GITHUB_WORKSPACE/.tmp/cli-integration" >> "$GITHUB_ENV"
      - run: npm test
      - run: npm run build
      - run: npm run release:validate
      - name: Package and preserve an existing reviewed release
        id: package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p 'require("./package.json").version')
          name="moe-icons-plugins-${version}.vsix"
          mkdir -p release-artifact candidate
          npx --no-install vsce package --out "candidate/$name"
          # API failure stops the job; only an absent release permits a new artifact.
          gh api repos/moewolf-dev/moe-icons-plugins/releases --paginate --jq '.[].tag_name' > candidate/release-tags.txt
          release_exists=$(node -e 'console.log(require("node:fs").readFileSync(process.argv[1], "utf8").split(/\r?\n/).includes(process.env.RELEASE_TAG))' candidate/release-tags.txt)
          if [ "$release_exists" = true ]; then
            gh release download "$RELEASE_TAG" --repo moewolf-dev/moe-icons-plugins --pattern "$name" --pattern vsix.sha256 --dir release-artifact
            (cd release-artifact && sha256sum --check vsix.sha256)
            export VSIX_NAME="$name"
            python3 - <<'PY'
          import os, zipfile
          name = os.environ['VSIX_NAME']
          with zipfile.ZipFile('candidate/' + name) as fresh, zipfile.ZipFile('release-artifact/' + name) as prior:
              assert sorted(fresh.namelist()) == sorted(prior.namelist()), 'Published artifact file list differs from the tagged build'
              for path in fresh.namelist():
                  assert fresh.read(path) == prior.read(path), 'Published artifact differs from the tagged build: ' + path
          print('Existing release matches the tagged build; retaining its exact VSIX bytes.')
          PY
          else
            cp "candidate/$name" "release-artifact/$name"
          fi
          digest=$(sha256sum "release-artifact/$name" | cut -d ' ' -f 1)
          echo "$digest  $name" > release-artifact/vsix.sha256
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reviewed-vsix
          path: |
            release-artifact/*.vsix
            release-artifact/vsix.sha256
          if-no-files-found: error
          retention-days: 14

  github-release:
    needs: package
    if: inputs.publish == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: reviewed-vsix
          path: release-artifact
      - name: Publish the same artifact to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          VSIX_NAME: ${{ needs.package.outputs.vsix-name }}
          VSIX_SHA256: ${{ needs.package.outputs.vsix-sha256 }}
        run: |
          printf '%s  release-artifact/%s\n' "$VSIX_SHA256" "$VSIX_NAME" | sha256sum --check
          gh api repos/moewolf-dev/moe-icons-plugins/releases --paginate --jq '.[].tag_name' > release-tags.txt
          release_exists=$(node -e 'console.log(require("node:fs").readFileSync(process.argv[1], "utf8").split(/\r?\n/).includes(process.env.RELEASE_TAG))' release-tags.txt)
          if [ "$release_exists" = true ]; then
            echo 'Existing release and reviewed assets retained.'
          else
            gh release create "$RELEASE_TAG" "release-artifact/$VSIX_NAME" release-artifact/vsix.sha256 --repo moewolf-dev/moe-icons-plugins --verify-tag --title "Moe Icons VS Code $RELEASE_TAG" --generate-notes
          fi

  publish:
    needs: [package, github-release]
    if: inputs.publish == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CORE_OUTPUT: none
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: reviewed-vsix
          path: release-artifact
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Verify and publish the exact VSIX using Entra ID
        env:
          VSIX_NAME: ${{ needs.package.outputs.vsix-name }}
          VSIX_SHA256: ${{ needs.package.outputs.vsix-sha256 }}
        run: |
          printf '%s  release-artifact/%s\n' "$VSIX_SHA256" "$VSIX_NAME" | sha256sum --check
          npx --no-install vsce verify-pat moewolf --azure-credential
          npx --no-install vsce publish --azure-credential --skip-duplicate --packagePath "release-artifact/$VSIX_NAME"
