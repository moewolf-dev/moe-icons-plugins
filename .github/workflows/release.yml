name: release

on:
  workflow_call:
    inputs:
      publish:
        description: Publish the reviewed VSIX using Marketplace OIDC trusted publishing.
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      publish:
        description: Publish from a matching vX.Y.Z tag after packaging. Requires a Marketplace trusted publishing policy.
        required: false
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      vsix-name: ${{ steps.package.outputs.name }}
      vsix-sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Require a tag for manual publishing
        if: inputs.publish == true
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          node -e 'if (!/^refs\/tags\/v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(process.env.RELEASE_REF || "")) { console.error("Publishing requires a stable vX.Y.Z tag."); process.exit(1); }'
      - run: npm ci
      - run: npm run compile
      - run: npm test
      - run: npm run build
      - run: npm run release:validate
      - name: Validate tag and version map
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e 'const p=require("./package.json"); if(process.env.RELEASE_TAG !== `v${p.version}`) process.exit(1);'
      - name: Package reviewed extension
        id: package
        run: |
          version=$(node -p 'require("./package.json").version')
          name="moe-icons-plugins-${version}.vsix"
          mkdir -p release-artifact
          npx --no-install vsce package --out "release-artifact/$name"
          digest=$(sha256sum "release-artifact/$name" | cut -d ' ' -f 1)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"
          echo "$digest  $name" > release-artifact/vsix.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reviewed-vsix
          path: |
            release-artifact/*.vsix
            release-artifact/vsix.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.publish == true) && github.repository == 'moewolf-dev/moe-icons-plugins' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: reviewed-vsix
          path: release-artifact
      - name: Verify and publish the exact VSIX with OIDC
        env:
          VSIX_NAME: ${{ needs.package.outputs.vsix-name }}
          VSIX_SHA256: ${{ needs.package.outputs.vsix-sha256 }}
        run: |
          printf '%s  release-artifact/%s\n' "$VSIX_SHA256" "$VSIX_NAME" | sha256sum --check
          npx --no-install vsce publish --oidc --packagePath "release-artifact/$VSIX_NAME"
